<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="description" content="SPI Tool — Software house specializzata in piattaforme SaaS con intelligenza artificiale operativa per professionisti e imprese." />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SPI Tool" />
    <meta property="og:title" content="SPI Tool — Piattaforme SaaS con AI operativa" />
    <meta property="og:description" content="Software house italiana specializzata in piattaforme SaaS verticali con intelligenza artificiale operativa, sempre supervisionata da un operatore umano." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SPI Tool",
      "url": "https://spitool.it",
      "description": "Software house italiana specializzata in piattaforme SaaS verticali con intelligenza artificiale operativa per professionisti e imprese.",
      "email": "info@spitool.it",
      "founder": {
        "@type": "Person",
        "name": "Raffaele Patarino",
        "jobTitle": "Founder & CEO"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Robbiate",
        "addressRegion": "LC",
        "addressCountry": "IT"
      },
      "makesOffer": [
        { "@type": "Offer", "name": "SPI Pension" },
        { "@type": "Offer", "name": "ACTELYA" },
        { "@type": "Offer", "name": "RistoAI" },
        { "@type": "Offer", "name": "Gestionale AI per PMI" }
      ]
    }
    </script>

    <title>SPI Tool — Piattaforme SaaS con AI operativa</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('spitool-theme') || 'dark';
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Per utilizzare questa applicazione è necessario abilitare JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
